<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="description" content="HomeMate - Need it? Add it. Someone gets it.">
<link rel="manifest" href="manifest.json">
<title>HomeMate</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:#f6f7fb;color:#171827}
.app{max-width:520px;margin:auto;min-height:100vh;background:#fff}.top{padding:24px 20px 14px;position:sticky;top:0;background:#fff;z-index:5;border-bottom:1px solid #eee}
.brand{font-size:28px;font-weight:800;letter-spacing:-.7px}.tag{color:#6b6d7a;font-size:13px;margin-top:3px}
.nav{display:flex;gap:8px;overflow:auto;padding:12px 20px;border-bottom:1px solid #eee;position:sticky;top:82px;background:#fff;z-index:4}.nav button{border:0;background:#f0f1f6;padding:9px 13px;border-radius:20px;white-space:nowrap}.nav button.active{background:#4f46e5;color:#fff}
main{padding:18px 20px 90px}.card{border:1px solid #e8e8ee;border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:0 3px 12px #00000008}.hero{background:#eef2ff;border:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:16px;border-radius:16px;background:#f7f7fa}.stat b{font-size:24px;display:block}.muted{color:#70727e;font-size:13px}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.item{padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}button.primary,button.small{border:0;background:#4f46e5;color:#fff;border-radius:12px;padding:11px 15px;font-weight:700}button.small{padding:8px 10px;font-size:12px}button.gray{border:0;background:#eeeef3;color:#333;border-radius:10px;padding:9px 11px}.input{width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:7px 0 12px;font-size:15px}.empty{text-align:center;padding:35px 10px;color:#777}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#171827;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:20}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">HomeMate</div><div class="tag">Need it? Add it. Someone gets it.</div></header>
<nav class="nav">
<button class="active" onclick="show('home',this)">Home</button><button onclick="show('list',this)">Shopping</button><button onclick="show('expense',this)">Expenses</button><button onclick="show('family',this)">Family</button>
</nav>
<main id="main"></main>
<div id="toast" class="toast"></div>
</div>
<script>
const KEY='homemate_v1';
let data=JSON.parse(localStorage.getItem(KEY)||'{"items":[],"expenses":[],"family":["You"]}');
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function money(n){return '₹'+Number(n||0).toLocaleString('en-IN')}
function toast(t){let x=document.getElementById('toast');x.textContent=t;x.style.display='block';setTimeout(()=>x.style.display='none',1800)}
function show(page,btn){
 document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active')); if(btn)btn.classList.add('active');
 let m=document.getElementById('main');
 if(page==='home')m.innerHTML=`<div class="card hero"><h2 style="margin:0 0 6px">Your home, organised.</h2><div class="muted">Add what is needed. Someone can pick it up. No duplicate shopping.</div><br><button class="primary" onclick="show('add')">＋ Add item</button></div>
 <div class="grid"><div class="stat"><span class="muted">Pending</span><b>${data.items.filter(x=>x.status==='pending').length}</b></div><div class="stat"><span class="muted">Purchased</span><b>${data.items.filter(x=>x.status==='purchased').length}</b></div></div>
 <div class="card"><div class="row"><b>Recent items</b><button class="gray" onclick="show('list')">View all</button></div>${itemsHTML(data.items.slice(-5).reverse())}</div>
 <div class="card"><div class="row"><b>This month</b><strong>${money(data.expenses.reduce((a,x)=>a+Number(x.amount),0))}</strong></div><div class="muted">Track household spending and avoid unnecessary purchases.</div></div>`;
 else if(page==='add')m.innerHTML=`<div class="card"><h2>Add item</h2><label>What do you need?</label><input id="name" class="input" placeholder="e.g. Milk"><label>Quantity</label><input id="qty" class="input" placeholder="e.g. 2 litres"><label>Added by</label><input id="by" class="input" value="You"><button class="primary" onclick="addItem()">Add to family list</button></div>`;
 else if(page==='list')m.innerHTML=`<div class="row" style="margin-bottom:14px"><h2 style="margin:0">Shopping list</h2><button class="primary" onclick="show('add')">＋ Add</button></div><div class="card">${itemsHTML(data.items)}</div>`;
 else if(page==='expense')m.innerHTML=`<div class="card"><h2>Household expenses</h2><div class="stat"><span class="muted">Total recorded</span><b>${money(data.expenses.reduce((a,x)=>a+Number(x.amount),0))}</b></div><br><input id="edesc" class="input" placeholder="What did you buy?"><input id="eamount" class="input" type="number" placeholder="Amount ₹"><button class="primary" onclick="addExpense()">Add expense</button></div><div class="card"><b>Recent expenses</b>${data.expenses.slice().reverse().map(x=>`<div class="item"><div class="row"><span>${esc(x.desc)}</span><b>${money(x.amount)}</b></div></div>`).join('')||'<div class="empty">No expenses yet.</div>'}</div>`;
 else if(page==='family')m.innerHTML=`<div class="card"><h2>Family</h2><p class="muted">Demo family workspace. Firebase can be connected later for real-time sync between phones.</p><div class="item">👤 You</div><button class="primary" onclick="toast('Family invite coming in the Firebase version')">Invite family member</button></div>`;
 else if(page==='home'){}
}
function itemsHTML(arr){return arr.length?arr.map(x=>`<div class="item"><div class="row"><div><b>${esc(x.name)}</b><div class="muted">${esc(x.qty||'')} · ${esc(x.by||'You')}</div>${x.pickedBy?`<div class="muted">Picked by ${esc(x.pickedBy)}</div>`:''}</div><div>${x.status==='pending'?`<button class="small" onclick="pickItem('${x.id}')">Pick</button>`:`<span class="muted">✓ ${x.status}</span>`}</div></div></div>`).join(''):'<div class="empty">No items yet.<br>Add something your family needs.</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function addItem(){let n=document.getElementById('name').value.trim();if(!n)return toast('Enter an item');let q=document.getElementById('qty').value.trim(),b=document.getElementById('by').value.trim()||'You';let duplicate=data.items.find(x=>x.name.toLowerCase()===n.toLowerCase()&&x.status!=='purchased');if(duplicate){toast('Already on the list — duplicate avoided');show('list');return}data.items.push({id:Date.now().toString(),name:n,qty:q,by:b,status:'pending'});save();toast('Added to family list');show('list')}
function pickItem(id){let x=data.items.find(i=>i.id===id);if(!x)return;if(x.pickedBy){toast('Already picked');return}x.pickedBy='You';x.status='picked';save();toast('You picked it');show('list')}
function addExpense(){let d=document.getElementById('edesc').value.trim(),a=Number(document.getElementById('eamount').value);if(!d||!a)return toast('Enter item and amount');data.expenses.push({desc:d,amount:a,date:new Date().toISOString()});save();toast('Expense added');show('expense')}
show('home');
</script>
</body>
</html>
